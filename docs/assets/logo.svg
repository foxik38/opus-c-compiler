<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220">
  <title>occ — the C23 compiler for x86-64 Linux</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1535"/>
    </linearGradient>
    <linearGradient id="pastel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4c1ff"/>
      <stop offset="0.35" stop-color="#a8c8ff"/>
      <stop offset="0.7" stop-color="#a6ecec"/>
      <stop offset="1" stop-color="#ffd1a8"/>
    </linearGradient>
  </defs>

  <!-- Pitch-black card with a hairline border: reads well on light and dark pages. -->
  <rect x="1" y="1" width="758" height="218" rx="24" fill="#000000" stroke="#262626" stroke-width="2"/>

  <!-- The mark: a dark blue tile with a terminal prompt and a pastel underline
       (the four pipeline stages). -->
  <rect x="36" y="36" width="148" height="148" rx="30" fill="url(#tile)"/>
  <rect x="36" y="36" width="148" height="148" rx="30" fill="none" stroke="#3b5bdb" stroke-opacity=".45" stroke-width="2"/>
  <text x="66" y="116" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace"
        font-size="56" font-weight="800" fill="#a8c8ff" textLength="34" lengthAdjust="spacingAndGlyphs">›</text>
  <rect x="110" y="104" width="36" height="10" rx="2" fill="#ffffff"/>
  <rect x="60" y="136" width="100" height="7" rx="3.5" fill="url(#pastel)"/>

  <!-- Wordmark. textLength pins every run to its box, whatever font renders it. -->
  <text x="220" y="116" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace"
        font-size="84" font-weight="800" fill="#ffffff" textLength="170" lengthAdjust="spacingAndGlyphs">occ</text>
  <text x="418" y="92" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25"
        font-weight="700" fill="#f5f5f5" textLength="300" lengthAdjust="spacingAndGlyphs">the C23 compiler</text>
  <text x="418" y="122" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19"
        fill="#8a8a8a" textLength="300" lengthAdjust="spacingAndGlyphs">for x86-64 Linux, written in C23</text>

  <!-- Pills. -->
  <g font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="600">
    <rect x="224" y="148" width="118" height="32" rx="16" fill="#0d0d0d" stroke="#262626"/>
    <text x="283" y="169" text-anchor="middle" fill="#a8c8ff" textLength="92" lengthAdjust="spacingAndGlyphs">self-hosting</text>
    <rect x="352" y="148" width="118" height="32" rx="16" fill="#0d0d0d" stroke="#262626"/>
    <text x="411" y="169" text-anchor="middle" fill="#b5f0c8" textLength="100" lengthAdjust="spacingAndGlyphs">SQLite-tested</text>
    <rect x="480" y="148" width="118" height="32" rx="16" fill="#0d0d0d" stroke="#262626"/>
    <text x="539" y="169" text-anchor="middle" fill="#d4c1ff" textLength="92" lengthAdjust="spacingAndGlyphs">-o none|prod</text>
    <rect x="608" y="148" width="112" height="32" rx="16" fill="#0d0d0d" stroke="#262626"/>
    <text x="664" y="169" text-anchor="middle" fill="#ffd1a8" textLength="84" lengthAdjust="spacingAndGlyphs">MIT licensed</text>
  </g>
</svg>
