<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150">
  <defs>
    <linearGradient id="stages" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d787ff"/>
      <stop offset="0.38" stop-color="#5fafff"/>
      <stop offset="0.7" stop-color="#5fd7d7"/>
      <stop offset="1" stop-color="#ffaf5f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
