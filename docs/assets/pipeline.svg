<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <title>The occ pipeline</title>
  <style>
    .t { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; fill: #ffffff; }
    .m { font-family: 'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace; fill: #a3a3a3; }
    .io { font-family: 'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size: 12px; fill: #737373; }
    .arrow { stroke: #525252; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="228" rx="18" fill="#000000" stroke="#262626" stroke-width="2"/>

  <text x="30" y="121" class="io">file.c</text>
  <path d="M76 116 H102" class="arrow"/>

  <!-- preprocess -->
  <rect x="106" y="62" width="152" height="108" rx="14" fill="#0d0d0d" stroke="#262626"/>
  <rect x="106" y="62" width="152" height="5" rx="2.5" fill="#d4c1ff"/>
  <text x="182" y="96" text-anchor="middle" class="t" font-size="16">preprocess</text>
  <text x="182" y="120" text-anchor="middle" class="m" font-size="11.5">macros, #include</text>
  <text x="182" y="136" text-anchor="middle" class="m" font-size="11.5">#embed, #if</text>
  <text x="182" y="156" text-anchor="middle" class="io">src/preproc</text>
  <path d="M258 116 H308" class="arrow"/>
  <text x="283" y="106" text-anchor="middle" class="io">tokens</text>

  <!-- compile: the dark blue heart of the pipeline -->
  <rect x="312" y="34" width="318" height="164" rx="16" fill="#0b1535" stroke="#1e3a8a" stroke-width="2"/>
  <text x="471" y="62" text-anchor="middle" class="t" font-size="16">compile</text>
  <g>
    <rect x="326" y="78" width="92" height="104" rx="10" fill="#000000" stroke="#1e3a8a"/>
    <text x="372" y="104" text-anchor="middle" class="t" font-size="13">parse</text>
    <text x="372" y="124" text-anchor="middle" class="m" font-size="11">typed AST</text>
    <text x="372" y="140" text-anchor="middle" class="m" font-size="11">+ checks</text>
    <text x="372" y="166" text-anchor="middle" class="io">src/parse</text>
    <rect x="425" y="78" width="92" height="104" rx="10" fill="#000000" stroke="#1e3a8a"/>
    <text x="471" y="104" text-anchor="middle" class="t" font-size="13">optimize</text>
    <text x="471" y="124" text-anchor="middle" class="m" font-size="11">fold, LICM</text>
    <text x="471" y="140" text-anchor="middle" class="m" font-size="11">-o prod</text>
    <text x="471" y="166" text-anchor="middle" class="io">src/opt</text>
    <rect x="524" y="78" width="92" height="104" rx="10" fill="#000000" stroke="#1e3a8a"/>
    <text x="570" y="104" text-anchor="middle" class="t" font-size="13">codegen</text>
    <text x="570" y="124" text-anchor="middle" class="m" font-size="11">SysV ABI</text>
    <text x="570" y="140" text-anchor="middle" class="m" font-size="11">peephole</text>
    <text x="570" y="166" text-anchor="middle" class="io">src/codegen</text>
  </g>
  <rect x="312" y="34" width="318" height="5" rx="2.5" fill="#a8c8ff"/>
  <path d="M630 116 H666" class="arrow"/>
  <text x="648" y="106" text-anchor="middle" class="io">.s</text>

  <!-- assemble -->
  <rect x="670" y="62" width="112" height="108" rx="14" fill="#0d0d0d" stroke="#262626"/>
  <rect x="670" y="62" width="112" height="5" rx="2.5" fill="#a6ecec"/>
  <text x="726" y="104" text-anchor="middle" class="t" font-size="16">assemble</text>
  <text x="726" y="128" text-anchor="middle" class="m" font-size="11.5">GNU as</text>
  <path d="M782 116 H808" class="arrow"/>
  <text x="795" y="106" text-anchor="middle" class="io">.o</text>

  <!-- link -->
  <rect x="812" y="62" width="92" height="108" rx="14" fill="#0d0d0d" stroke="#262626"/>
  <rect x="812" y="62" width="92" height="5" rx="2.5" fill="#ffd1a8"/>
  <text x="858" y="104" text-anchor="middle" class="t" font-size="16">link</text>
  <text x="858" y="128" text-anchor="middle" class="m" font-size="11.5">ld, PIE</text>
  <path d="M904 116 H928" class="arrow"/>
  <text x="962" y="112" text-anchor="middle" class="io">ELF</text>
  <text x="962" y="126" text-anchor="middle" class="io">binary</text>
</svg>
